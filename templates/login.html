<!DOCTYPE html>
<html>
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
        <link rel="stylesheet" type="text/css" href="cid:css-4ef08e32-d8bc-4230-a9ac-1f8182cc61c6@mhtml.blink" />
        <title>Login</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>

        <h1>Login</h1>
        <form action="http://127.0.0.1:5000/login" method="post" name="login_user_form">

            <div class="fs-div" id="username-ctr">
                <label for="username">Username</label>
                <input autocomplete="username" id="username" name="username" required type="text" value="">
            </div>

            <div class="fs-gap">
                <div class="fs-div" id="password-ctr">
                    <label for="password">Password</label>
                    <input autocomplete="current-password" id="password" name="password" required type="password" value="">
                </div>
            </div>

            <div class="fs-div" id="submit-ctr">
                <input id="submit" name="submit" type="submit" value="Login">
            </div>
        </form>
    </body>
</html>
